<text x="537" y="225" text-anchor="middle" fill="#111" font-family="Georgia,serif" font-size="48" font-weight="700"><tspan x="537" dy="0">Prima di stampare</tspan></text>
<rect x="140" y="260" width="795" height="80" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="537" y="292" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="20" font-weight="400" font-style="italic"><tspan x="537" dy="0">Segui queste indicazioni per stampare i cartamodelli</tspan><tspan x="537" dy="24">correttamente e nella misura giusta.</tspan></text>
<rect x="170" y="340" width="735" height="46" rx="5" fill="#fbf5e8" opacity="0.99"/>
<text x="537" y="369" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="17" font-weight="400" font-style="italic"><tspan x="537" dy="0">Una buona stampa è il primo passo verso un bel risultato.</tspan></text>
<rect x="35" y="400" width="305" height="58" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="187.5" y="436" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="187.5" dy="0">Stampa al 100%</tspan></text>
<rect x="49" y="650" width="277" height="120" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="187.5" y="678" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="187.5" dy="0">Select actual size (100%)</tspan><tspan x="187.5" dy="17">so the patterns print</tspan><tspan x="187.5" dy="17">at the correct size.</tspan></text>
<rect x="370" y="400" width="305" height="58" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="522.5" y="436" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="522.5" dy="0">Non usare “Adatta alla pagina”</tspan></text>
<rect x="384" y="650" width="277" height="120" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="522.5" y="678" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="522.5" dy="0">Non usare “Adatta alla pagina”</tspan><tspan x="522.5" dy="17">or similar options.</tspan><tspan x="522.5" dy="17">They can change the size.</tspan></text>
<rect x="705" y="400" width="335" height="58" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="872.5" y="436" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="872.5" dy="0">Controlla il quadrato</tspan></text>
<rect x="719" y="650" width="307" height="120" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="872.5" y="678" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="872.5" dy="0">Measure the 5 cm</tspan><tspan x="872.5" dy="17">control square after printing</tspan><tspan x="872.5" dy="17">to confirm the scale.</tspan></text>
<rect x="35" y="780" width="305" height="58" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="187.5" y="816" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="187.5" dy="0">Carta A4</tspan></text>
<rect x="49" y="1050" width="277" height="120" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="187.5" y="1078" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="187.5" dy="0">Use A4 paper</tspan><tspan x="187.5" dy="17">210 × 297 mm.</tspan><tspan x="187.5" dy="17">75 g/m² or heavier.</tspan></text>
<rect x="370" y="780" width="305" height="58" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="522.5" y="816" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="522.5" dy="0">Forbici</tspan></text>
<rect x="384" y="1050" width="277" height="120" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="522.5" y="1078" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="522.5" dy="0">Use sharp scissors</tspan><tspan x="522.5" dy="17">for clean, precise</tspan><tspan x="522.5" dy="17">cuts and curves.</tspan></text>
<rect x="705" y="780" width="335" height="58" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="872.5" y="816" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="872.5" dy="0">Organizza i pezzi</tspan></text>
<rect x="719" y="1050" width="307" height="120" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="872.5" y="1078" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="872.5" dy="0">Separate and organise</tspan><tspan x="872.5" dy="17">the patterns by category</tspan><tspan x="872.5" dy="17">before cutting.</tspan></text>
<rect x="35" y="1185" width="320" height="50" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="195" y="1218" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="16" font-weight="700"><tspan x="195" dy="0">Esempio di pagina</tspan></text>
<rect x="40" y="1235" width="315" height="120" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="197" y="1272" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400" font-style="italic"><tspan x="197" dy="0">Example of how a pattern</tspan><tspan x="197" dy="17">page is organised.</tspan></text>
<rect x="760" y="1190" width="285" height="50" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="902" y="1222" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="902" dy="0">CONSIGLIO IMPORTANTE</tspan></text>
<rect x="755" y="1240" width="290" height="115" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="900" y="1273" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="13" font-weight="400" font-style="italic"><tspan x="900" dy="0">If the control square is not 5 cm,</tspan><tspan x="900" dy="15">check your printer settings</tspan><tspan x="900" dy="15">and print the test page again.</tspan></text>
<rect x="35" y="1390" width="350" height="95" rx="0" fill="#9f1720" opacity="0.98"/>
<text x="50" y="1422" text-anchor="start" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="400" font-style="italic"><tspan x="50" dy="0">Preparare bene oggi rende</tspan><tspan x="50" dy="18">tutto più facile dopo.</tspan></text>
