<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1075" height="1521" viewBox="0 0 1075 1521">
<image href="/assets/maria-v4-vestindo.webp" x="0" y="0" width="1075" height="1521" preserveAspectRatio="xMidYMid slice"/>
<rect x="245" y="25" width="520" height="135" rx="0" fill="#07513c" opacity="0.98"/>
<text x="505" y="65" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="38" font-weight="700"><tspan x="505" dy="0">COLLEZIONE</tspan><tspan x="505" dy="45">PRESEPE IN FELTRO</tspan></text>
<rect x="820" y="30" width="235" height="110" rx="0" fill="#07513c" opacity="0.98"/>
<text x="938" y="58" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="21" font-weight="400" font-style="italic"><tspan x="938" dy="0">Piccoli gesti,</tspan><tspan x="938" dy="25">grandi significati.</tspan></text>
<rect x="185" y="180" width="705" height="110" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="537" y="245" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="48" font-weight="700"><tspan x="537" dy="0">Vestire Maria</tspan></text>
<rect x="245" y="290" width="585" height="55" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="537" y="320" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="17" font-weight="400" font-style="italic"><tspan x="537" dy="0">Segui il passo passo per vestire e completare la tua Maria.</tspan></text>
<rect x="25" y="365" width="242" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="146" y="397" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="146" dy="0">Unire testa e corpo</tspan></text>
<rect x="35" y="700" width="222" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="146" y="725" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="146" dy="0">Sew the head to the body</tspan><tspan x="146" dy="15">and align the pieces.</tspan></text>
<rect x="280" y="365" width="242" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="401" y="397" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="401" dy="0">Fissare braccia M07/M08</tspan></text>
<rect x="290" y="700" width="222" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="401" y="725" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="401" dy="0">Sew the assembled arms</tspan><tspan x="401" dy="15">with the hands in prayer.</tspan></text>
<rect x="535" y="365" width="242" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="656" y="397" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="656" dy="0">Applicare mantello M17</tspan></text>
<rect x="545" y="700" width="222" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="656" y="725" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="656" dy="0">Place M17 on the back.</tspan><tspan x="656" dy="15">Keep the hair visible.</tspan></text>
<rect x="790" y="365" width="245" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="912.5" y="397" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="912.5" dy="0">Applicare M15 e M16</tspan></text>
<rect x="800" y="700" width="225" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="912.5" y="725" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="912.5" dy="0">Place M15 and M16</tspan><tspan x="912.5" dy="15">over the shoulders.</tspan></text>
<rect x="25" y="870" width="242" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="146" y="902" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="146" dy="0">Applicare velo M18</tspan></text>
<rect x="35" y="1210" width="222" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="146" y="1235" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="146" dy="0">Place M18 over the head</tspan><tspan x="146" dy="15">and adjust carefully.</tspan></text>
<rect x="280" y="870" width="242" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="401" y="902" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="401" dy="0">Legare il cordoncino</tspan></text>
<rect x="290" y="1210" width="222" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="401" y="1235" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="401" dy="0">Tie the cord around</tspan><tspan x="401" dy="15">the waist, about 26 cm.</tspan></text>
<rect x="535" y="870" width="242" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="656" y="902" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="656" dy="0">Fissare alla base</tspan></text>
<rect x="545" y="1210" width="222" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="656" y="1235" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="656" dy="0">Centre Mary on the base</tspan><tspan x="656" dy="15">and check stability.</tspan></text>
<rect x="790" y="870" width="245" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="912.5" y="902" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="912.5" dy="0">Risultato finale</tspan></text>
<rect x="800" y="1210" width="225" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="912.5" y="1235" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="912.5" dy="0">Your Mary is ready</tspan><tspan x="912.5" dy="15">for your Christmas nativity.</tspan></text>
<rect x="70" y="1390" width="650" height="90" rx="0" fill="#07513c" opacity="0.98"/>
<text x="90" y="1425" text-anchor="start" fill="#fffaf0" font-family="Georgia,serif" font-size="16" font-weight="400" font-style="italic"><tspan x="90" dy="0">Ogni dettaglio prende vita nelle tue mani.</tspan></text>
</svg>