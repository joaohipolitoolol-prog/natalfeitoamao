<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1075" height="1521" viewBox="0 0 1075 1521">
<image href="/assets/maria-v4-vestindo.webp" x="0" y="0" width="1075" height="1521" preserveAspectRatio="xMidYMid slice"/>
<rect x="245" y="25" width="520" height="135" rx="0" fill="#07513c" opacity="0.98"/>
<text x="505" y="65" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="38" font-weight="700"><tspan x="505" dy="0">COLECCIÓN</tspan><tspan x="505" dy="45">PESEBRE EN FIELTRO</tspan></text>
<rect x="820" y="30" width="235" height="110" rx="0" fill="#07513c" opacity="0.98"/>
<text x="938" y="58" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="21" font-weight="400" font-style="italic"><tspan x="938" dy="0">Pequeños gestos,</tspan><tspan x="938" dy="25">grandes significados.</tspan></text>
<rect x="185" y="180" width="705" height="110" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="537" y="245" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="48" font-weight="700"><tspan x="537" dy="0">Vistiendo a María</tspan></text>
<rect x="245" y="290" width="585" height="55" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="537" y="320" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="17" font-weight="400" font-style="italic"><tspan x="537" dy="0">Sigue el paso a paso para vestir y terminar tu María.</tspan></text>
<rect x="25" y="365" width="242" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="146" y="397" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="146" dy="0">Unir cabeza al cuerpo</tspan></text>
<rect x="35" y="700" width="222" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="146" y="725" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="146" dy="0">Cose la cabeza al cuerpo</tspan><tspan x="146" dy="15">y alinea las piezas.</tspan></text>
<rect x="280" y="365" width="242" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="401" y="397" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="401" dy="0">Fijar brazos M07/M08</tspan></text>
<rect x="290" y="700" width="222" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="401" y="725" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="401" dy="0">Cose los brazos montados</tspan><tspan x="401" dy="15">con las manos en oración.</tspan></text>
<rect x="535" y="365" width="242" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="656" y="397" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="656" dy="0">Aplicar manto M17</tspan></text>
<rect x="545" y="700" width="222" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="656" y="725" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="656" dy="0">Coloca M17 atrás.</tspan><tspan x="656" dy="15">Mantén visible el cabello.</tspan></text>
<rect x="790" y="365" width="245" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="912.5" y="397" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="912.5" dy="0">Aplicar mantos M15/M16</tspan></text>
<rect x="800" y="700" width="225" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="912.5" y="725" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="912.5" dy="0">Coloca M15 y M16</tspan><tspan x="912.5" dy="15">sobre los hombros.</tspan></text>
<rect x="25" y="870" width="242" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="146" y="902" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="146" dy="0">Aplicar velo M18</tspan></text>
<rect x="35" y="1210" width="222" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="146" y="1235" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="146" dy="0">Coloca M18 sobre la cabeza</tspan><tspan x="146" dy="15">y ajusta con cuidado.</tspan></text>
<rect x="280" y="870" width="242" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="401" y="902" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="401" dy="0">Atar el cordón</tspan></text>
<rect x="290" y="1210" width="222" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="401" y="1235" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="401" dy="0">Ata el cordón a la cintura,</tspan><tspan x="401" dy="15">aprox. 26 cm.</tspan></text>
<rect x="535" y="870" width="242" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="656" y="902" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="656" dy="0">Fijar a la base</tspan></text>
<rect x="545" y="1210" width="222" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="656" y="1235" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="656" dy="0">Centra a María en la base</tspan><tspan x="656" dy="15">y comprueba la estabilidad.</tspan></text>
<rect x="790" y="870" width="245" height="52" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="912.5" y="902" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="912.5" dy="0">Resultado final</tspan></text>
<rect x="800" y="1210" width="225" height="100" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="912.5" y="1235" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="12.5" font-weight="400"><tspan x="912.5" dy="0">¡Tu María está lista</tspan><tspan x="912.5" dy="15">para el pesebre de Navidad!</tspan></text>
<rect x="70" y="1390" width="650" height="90" rx="0" fill="#07513c" opacity="0.98"/>
<text x="90" y="1425" text-anchor="start" fill="#fffaf0" font-family="Georgia,serif" font-size="16" font-weight="400" font-style="italic"><tspan x="90" dy="0">Cada detalle cobra vida en tus manos.</tspan></text>
</svg>