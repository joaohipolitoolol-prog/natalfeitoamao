<rect x="150" y="255" width="790" height="75" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="537" y="285" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="19" font-weight="400" font-style="italic"><tspan x="537" dy="0">Check the materials list and learn how to identify</tspan><tspan x="537" dy="22">the pattern pieces to make your Mary.</tspan></text>
<rect x="35" y="1020" width="330" height="185" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="200" y="1060" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="19" font-weight="400" font-style="italic"><tspan x="200" dy="0">With the right materials,</tspan><tspan x="200" dy="22">your Mary takes shape</tspan><tspan x="200" dy="22">and becomes even more special.</tspan></text>
