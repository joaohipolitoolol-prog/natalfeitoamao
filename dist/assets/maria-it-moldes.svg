<text x="530" y="440" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="530" dy="0">Skin-tone felt</tspan></text>
<text x="530" y="512" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="530" dy="0">Brown felt</tspan></text>
<text x="530" y="584" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="530" dy="0">Cream felt</tspan></text>
<text x="530" y="656" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="530" dy="0">Blue felt</tspan></text>
<text x="530" y="728" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="530" dy="0">Dark brown felt</tspan></text>
