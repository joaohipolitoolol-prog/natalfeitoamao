<text x="530" y="1016" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="530" dy="0">Golden or ochre cord</tspan></text>
<text x="910" y="445" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="910" dy="0">Fabric scissors</tspan></text>
