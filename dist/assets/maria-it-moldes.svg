<text x="902" y="910" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="19" font-weight="700"><tspan x="902" dy="0">Codice del pezzo</tspan></text>
<rect x="765" y="930" width="280" height="180" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="780" y="965" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="13" font-weight="400"><tspan x="780" dy="0">Each pattern piece has its own code</tspan><tspan x="780" dy="15">such as M01, M02 or M03.</tspan><tspan x="780" dy="15">The code helps identify every part.</tspan></text>
<rect x="760" y="1115" width="285" height="55" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="902" y="1150" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="902" dy="0">Legenda cartamodelli</tspan></text>
<rect x="765" y="1170" width="280" height="160" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="780" y="1195" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="13" font-weight="400"><tspan x="780" dy="0">1x = cut once</tspan></text>
<text x="780" y="1227" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="13" font-weight="400"><tspan x="780" dy="0">2x = cut twice</tspan></text>
<text x="780" y="1259" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="13" font-weight="400"><tspan x="780" dy="0">front = front piece</tspan></text>
<text x="780" y="1291" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="13" font-weight="400"><tspan x="780" dy="0">back = back piece</tspan></text>
<rect x="120" y="1390" width="520" height="90" rx="0" fill="#07513c" opacity="0.98"/>
<text x="140" y="1425" text-anchor="start" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="400" font-style="italic"><tspan x="140" dy="0">L’organizzazione è il primo passo verso un bel risultato.</tspan></text>
