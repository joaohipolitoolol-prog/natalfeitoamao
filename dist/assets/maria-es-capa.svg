<text x="505" y="65" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="38" font-weight="700"><tspan x="505" dy="0">COLECCIÓN</tspan><tspan x="505" dy="45">PESEBRE EN FIELTRO</tspan></text>
<rect x="820" y="30" width="235" height="110" rx="0" fill="#07513c" opacity="0.98"/>
<text x="938" y="58" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="21" font-weight="400" font-style="italic"><tspan x="938" dy="0">Pequeños gestos,</tspan><tspan x="938" dy="25">grandes significados.</tspan></text>
<rect x="205" y="190" width="665" height="170" rx="4" fill="#9f1720" opacity="0.99"/>
<text x="537" y="282" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="72" font-weight="700"><tspan x="537" dy="0">María</tspan></text>
<rect x="275" y="350" width="525" height="70" rx="7" fill="#fbf5e8" opacity="0.99"/>
<text x="538" y="382" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="23" font-weight="700"><tspan x="538" dy="0">MOLDES Y GUÍA ILUSTRADA</tspan></text>
<rect x="255" y="420" width="565" height="55" rx="4" fill="#fbf5e8" opacity="0.99"/>
<text x="538" y="447" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="20" font-weight="400" font-style="italic"><tspan x="538" dy="0">Proyecto completo con guía visual paso a paso</tspan></text>
<rect x="45" y="610" width="245" height="220" rx="0" fill="#fbf5e8" opacity="0.98"/>
<text x="168" y="655" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="27" font-weight="400" font-style="italic"><tspan x="168" dy="0">Más artesanía</tspan><tspan x="168" dy="32">para una Navidad</tspan><tspan x="168" dy="32">aún más especial.</tspan></text>
<rect x="45" y="845" width="245" height="145" rx="0" fill="#fbf5e8" opacity="0.98"/>
<text x="168" y="882" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="18" font-weight="400" font-style="italic"><tspan x="168" dy="0">Donde hay arte hecho a mano,</tspan><tspan x="168" dy="21">hay más amor en el mundo.</tspan></text>
<rect x="865" y="510" width="185" height="145" rx="0" fill="#fbf5e8" opacity="0.98"/>
<text x="875" y="542" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="875" dy="0">Moldes en</tspan><tspan x="875" dy="21">tamaño real</tspan></text>
<text x="875" y="595" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="15" font-weight="400" font-style="italic"><tspan x="875" dy="0">Imprime, recorta</tspan><tspan x="875" dy="18">y crea fácilmente.</tspan></text>
<rect x="865" y="700" width="185" height="145" rx="0" fill="#fbf5e8" opacity="0.98"/>
<text x="875" y="732" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="875" dy="0">Materiales y</tspan><tspan x="875" dy="21">herramientas</tspan></text>
<text x="875" y="785" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="15" font-weight="400" font-style="italic"><tspan x="875" dy="0">Lista completa</tspan><tspan x="875" dy="18">con sugerencias.</tspan></text>
<rect x="865" y="890" width="185" height="145" rx="0" fill="#fbf5e8" opacity="0.98"/>
<text x="875" y="922" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="875" dy="0">Guía visual</tspan><tspan x="875" dy="21">paso a paso</tspan></text>
<text x="875" y="975" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="15" font-weight="400" font-style="italic"><tspan x="875" dy="0">Fotos e ilustraciones</tspan><tspan x="875" dy="18">detalladas.</tspan></text>
<rect x="865" y="1080" width="185" height="145" rx="0" fill="#fbf5e8" opacity="0.98"/>
<text x="875" y="1112" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="875" dy="0">Montaje y</tspan><tspan x="875" dy="21">acabado</tspan></text>
<text x="875" y="1165" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="15" font-weight="400" font-style="italic"><tspan x="875" dy="0">Consejos para un</tspan><tspan x="875" dy="18">resultado bonito.</tspan></text>
<rect x="220" y="1390" width="680" height="90" rx="0" fill="#07513c" opacity="0.98"/>
<text x="560" y="1436" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="20" font-weight="400" font-style="italic"><tspan x="560" dy="0">La Navidad se vuelve aún más especial cuando está hecha a mano.</tspan></text>
