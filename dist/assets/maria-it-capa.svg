<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1075" height="1521" viewBox="0 0 1075 1521">
<image href="/assets/maria-v4-capa.webp" x="0" y="0" width="1075" height="1521" preserveAspectRatio="xMidYMid slice"/>
<rect x="245" y="25" width="520" height="135" rx="0" fill="#07513c" opacity="0.98"/>
<text x="505" y="65" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="38" font-weight="700"><tspan x="505" dy="0">COLLEZIONE</tspan><tspan x="505" dy="45">PRESEPE IN FELTRO</tspan></text>
<rect x="820" y="30" width="235" height="110" rx="0" fill="#07513c" opacity="0.98"/>
<text x="938" y="58" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="21" font-weight="400" font-style="italic"><tspan x="938" dy="0">Piccoli gesti,</tspan><tspan x="938" dy="25">grandi significati.</tspan></text>
<rect x="205" y="190" width="665" height="170" rx="4" fill="#9f1720" opacity="0.99"/>
<text x="537" y="282" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="72" font-weight="700"><tspan x="537" dy="0">Maria</tspan></text>
<rect x="275" y="350" width="525" height="70" rx="7" fill="#fbf5e8" opacity="0.99"/>
<text x="538" y="382" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="23" font-weight="700"><tspan x="538" dy="0">CARTAMODELLI E GUIDA ILLUSTRATA</tspan></text>
<rect x="255" y="420" width="565" height="55" rx="4" fill="#fbf5e8" opacity="0.99"/>
<text x="538" y="447" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="20" font-weight="400" font-style="italic"><tspan x="538" dy="0">Progetto completo con guida visiva passo dopo passo</tspan></text>
<rect x="45" y="610" width="245" height="220" rx="0" fill="#fbf5e8" opacity="0.98"/>
<text x="168" y="655" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="27" font-weight="400" font-style="italic"><tspan x="168" dy="0">Più artigianato</tspan><tspan x="168" dy="32">per un Natale</tspan><tspan x="168" dy="32">ancora più speciale.</tspan></text>
<rect x="45" y="845" width="245" height="145" rx="0" fill="#fbf5e8" opacity="0.98"/>
<text x="168" y="882" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="18" font-weight="400" font-style="italic"><tspan x="168" dy="0">Dove c’è arte fatta a mano,</tspan><tspan x="168" dy="21">c’è più amore nel mondo.</tspan></text>
<rect x="865" y="510" width="185" height="145" rx="0" fill="#fbf5e8" opacity="0.98"/>
<text x="875" y="542" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="875" dy="0">Cartamodelli a</tspan><tspan x="875" dy="21">grandezza reale</tspan></text>
<text x="875" y="595" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="15" font-weight="400" font-style="italic"><tspan x="875" dy="0">Stampa, ritaglia</tspan><tspan x="875" dy="18">e crea facilmente.</tspan></text>
<rect x="865" y="700" width="185" height="145" rx="0" fill="#fbf5e8" opacity="0.98"/>
<text x="875" y="732" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="875" dy="0">Materiali e</tspan><tspan x="875" dy="21">strumenti</tspan></text>
<text x="875" y="785" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="15" font-weight="400" font-style="italic"><tspan x="875" dy="0">Lista completa</tspan><tspan x="875" dy="18">con suggerimenti.</tspan></text>
<rect x="865" y="890" width="185" height="145" rx="0" fill="#fbf5e8" opacity="0.98"/>
<text x="875" y="922" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="875" dy="0">Guida visiva</tspan><tspan x="875" dy="21">passo passo</tspan></text>
<text x="875" y="975" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="15" font-weight="400" font-style="italic"><tspan x="875" dy="0">Foto e illustrazioni</tspan><tspan x="875" dy="18">dettagliate.</tspan></text>
<rect x="865" y="1080" width="185" height="145" rx="0" fill="#fbf5e8" opacity="0.98"/>
<text x="875" y="1112" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="875" dy="0">Montaggio e</tspan><tspan x="875" dy="21">rifinitura</tspan></text>
<text x="875" y="1165" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="15" font-weight="400" font-style="italic"><tspan x="875" dy="0">Consigli per un</tspan><tspan x="875" dy="18">bel risultato.</tspan></text>
<rect x="220" y="1390" width="680" height="90" rx="0" fill="#07513c" opacity="0.98"/>
<text x="560" y="1436" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="20" font-weight="400" font-style="italic"><tspan x="560" dy="0">Il Natale è ancora più speciale quando è fatto a mano.</tspan></text>
</svg>