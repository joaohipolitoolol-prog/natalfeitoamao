<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1075" height="1521" viewBox="0 0 1075 1521">
<image href="/assets/maria-v4-montagem-cabeca.webp" x="0" y="0" width="1075" height="1521" preserveAspectRatio="xMidYMid slice"/>
<rect x="245" y="25" width="520" height="135" rx="0" fill="#07513c" opacity="0.98"/>
<text x="505" y="65" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="38" font-weight="700"><tspan x="505" dy="0">COLECCIÓN</tspan><tspan x="505" dy="45">PESEBRE EN FIELTRO</tspan></text>
<rect x="820" y="30" width="235" height="110" rx="0" fill="#07513c" opacity="0.98"/>
<text x="938" y="58" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="21" font-weight="400" font-style="italic"><tspan x="938" dy="0">Pequeños gestos,</tspan><tspan x="938" dy="25">grandes significados.</tspan></text>
<rect x="185" y="180" width="705" height="80" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="537" y="226" text-anchor="middle" fill="#111" font-family="Georgia,serif" font-size="48" font-weight="700"><tspan x="537" dy="0">Montaje de la cabeza</tspan></text>
<rect x="205" y="255" width="665" height="60" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="537" y="285" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="18" font-weight="400" font-style="italic"><tspan x="537" dy="0">Sigue el paso a paso para montar la cabeza de tu María.</tspan></text>
<rect x="30" y="360" width="320" height="55" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="190" y="395" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="190" dy="0">Separar las piezas</tspan></text>
<rect x="42" y="690" width="296" height="115" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="190" y="718" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="190" dy="0">Separa M01 frontal</tspan><tspan x="190" dy="17">y M02 trasera</tspan><tspan x="190" dy="17">en fieltro color piel.</tspan></text>
<rect x="378" y="360" width="319" height="55" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="537.5" y="395" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="537.5" dy="0">Marcar los ojos</tspan></text>
<rect x="390" y="690" width="295" height="115" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="537.5" y="718" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="537.5" dy="0">Marca la posición</tspan><tspan x="537.5" dy="17">de los ojos en M01</tspan><tspan x="537.5" dy="17">siguiendo el molde.</tspan></text>
<rect x="725" y="360" width="320" height="55" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="885" y="395" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="885" dy="0">Colocar los ojos</tspan></text>
<rect x="737" y="690" width="296" height="115" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="885" y="718" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="885" dy="0">Coloca los ojos</tspan><tspan x="885" dy="17">de seguridad y fíjalos</tspan><tspan x="885" dy="17">por detrás.</tspan></text>
<rect x="30" y="850" width="320" height="55" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="190" y="885" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="190" dy="0">Bordar el rostro</tspan></text>
<rect x="42" y="1180" width="296" height="115" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="190" y="1208" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="190" dy="0">Borda la boca</tspan><tspan x="190" dy="17">y añade rubor</tspan><tspan x="190" dy="17">en las mejillas.</tspan></text>
<rect x="378" y="850" width="319" height="55" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="537.5" y="885" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="537.5" dy="0">Unir las piezas</tspan></text>
<rect x="390" y="1180" width="295" height="115" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="537.5" y="1208" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="537.5" dy="0">Cose M01 y M02</tspan><tspan x="537.5" dy="17">dejando abierta</tspan><tspan x="537.5" dy="17">la parte inferior.</tspan></text>
<rect x="725" y="850" width="320" height="55" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="885" y="885" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="885" dy="0">Añadir el relleno</tspan></text>
<rect x="737" y="1180" width="296" height="115" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="885" y="1208" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="885" dy="0">Rellena poco a poco</tspan><tspan x="885" dy="17">con fibra y cierra</tspan><tspan x="885" dy="17">al unir al cuerpo.</tspan></text>
<rect x="100" y="1390" width="620" height="90" rx="0" fill="#07513c" opacity="0.98"/>
<text x="120" y="1425" text-anchor="start" fill="#fffaf0" font-family="Georgia,serif" font-size="16" font-weight="400" font-style="italic"><tspan x="120" dy="0">Cada etapa construye algo aún más especial.</tspan></text>
</svg>