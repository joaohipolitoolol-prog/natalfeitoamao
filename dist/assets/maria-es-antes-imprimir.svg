<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1075" height="1521" viewBox="0 0 1075 1521">
<image href="/assets/maria-v4-antes-imprimir.webp" x="0" y="0" width="1075" height="1521" preserveAspectRatio="xMidYMid slice"/>
<rect x="245" y="25" width="520" height="135" rx="0" fill="#07513c" opacity="0.98"/>
<text x="505" y="65" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="38" font-weight="700"><tspan x="505" dy="0">COLECCIÓN</tspan><tspan x="505" dy="45">PESEBRE EN FIELTRO</tspan></text>
<rect x="820" y="30" width="235" height="110" rx="0" fill="#07513c" opacity="0.98"/>
<text x="938" y="58" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="21" font-weight="400" font-style="italic"><tspan x="938" dy="0">Pequeños gestos,</tspan><tspan x="938" dy="25">grandes significados.</tspan></text>
<rect x="170" y="175" width="735" height="90" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="537" y="225" text-anchor="middle" fill="#111" font-family="Georgia,serif" font-size="48" font-weight="700"><tspan x="537" dy="0">Antes de imprimir</tspan></text>
<rect x="140" y="260" width="795" height="80" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="537" y="292" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="20" font-weight="400" font-style="italic"><tspan x="537" dy="0">Sigue estas indicaciones para que tus moldes</tspan><tspan x="537" dy="24">se impriman correctamente y al tamaño ideal.</tspan></text>
<rect x="170" y="340" width="735" height="46" rx="5" fill="#fbf5e8" opacity="0.99"/>
<text x="537" y="369" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="17" font-weight="400" font-style="italic"><tspan x="537" dy="0">Una buena impresión es el primer paso para un resultado bonito.</tspan></text>
<rect x="35" y="400" width="305" height="58" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="187.5" y="436" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="187.5" dy="0">Imprimir al 100%</tspan></text>
<rect x="49" y="650" width="277" height="120" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="187.5" y="678" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="187.5" dy="0">Selecciona tamaño real</tspan><tspan x="187.5" dy="17">(100%) para imprimir</tspan><tspan x="187.5" dy="17">al tamaño correcto.</tspan></text>
<rect x="370" y="400" width="305" height="58" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="522.5" y="436" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="522.5" dy="0">No usar “Ajustar a la página”</tspan></text>
<rect x="384" y="650" width="277" height="120" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="522.5" y="678" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="522.5" dy="0">No uses “Ajustar a la página”</tspan><tspan x="522.5" dy="17">ni opciones similares.</tspan><tspan x="522.5" dy="17">Pueden alterar el tamaño.</tspan></text>
<rect x="705" y="400" width="335" height="58" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="872.5" y="436" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="872.5" dy="0">Comprobar el cuadrado</tspan></text>
<rect x="719" y="650" width="307" height="120" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="872.5" y="678" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="872.5" dy="0">Mide el cuadrado de 5 cm</tspan><tspan x="872.5" dy="17">después de imprimir</tspan><tspan x="872.5" dy="17">para comprobar la escala.</tspan></text>
<rect x="35" y="780" width="305" height="58" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="187.5" y="816" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="187.5" dy="0">Papel A4</tspan></text>
<rect x="49" y="1050" width="277" height="120" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="187.5" y="1078" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="187.5" dy="0">Usa papel A4</tspan><tspan x="187.5" dy="17">210 × 297 mm.</tspan><tspan x="187.5" dy="17">75 g/m² o superior.</tspan></text>
<rect x="370" y="780" width="305" height="58" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="522.5" y="816" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="522.5" dy="0">Tijeras</tspan></text>
<rect x="384" y="1050" width="277" height="120" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="522.5" y="1078" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="522.5" dy="0">Usa tijeras afiladas</tspan><tspan x="522.5" dy="17">para cortes más limpios</tspan><tspan x="522.5" dy="17">y precisos.</tspan></text>
<rect x="705" y="780" width="335" height="58" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="872.5" y="816" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="18" font-weight="700"><tspan x="872.5" dy="0">Organizar las piezas</tspan></text>
<rect x="719" y="1050" width="307" height="120" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="872.5" y="1078" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="872.5" dy="0">Separa y organiza</tspan><tspan x="872.5" dy="17">los moldes por categoría</tspan><tspan x="872.5" dy="17">antes de recortar.</tspan></text>
<rect x="35" y="1185" width="320" height="50" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="195" y="1218" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="16" font-weight="700"><tspan x="195" dy="0">Ejemplo de página</tspan></text>
<rect x="40" y="1235" width="315" height="120" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="197" y="1272" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400" font-style="italic"><tspan x="197" dy="0">Ejemplo de cómo está</tspan><tspan x="197" dy="17">organizada una página.</tspan></text>
<rect x="760" y="1190" width="285" height="50" rx="0" fill="#9f1720" opacity="0.99"/>
<text x="902" y="1222" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="700"><tspan x="902" dy="0">CONSEJO IMPORTANTE</tspan></text>
<rect x="755" y="1240" width="290" height="115" rx="0" fill="#fbf5e8" opacity="0.99"/>
<text x="900" y="1273" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="13" font-weight="400" font-style="italic"><tspan x="900" dy="0">Si el cuadrado no mide 5 cm,</tspan><tspan x="900" dy="15">revisa la configuración</tspan><tspan x="900" dy="15">y vuelve a imprimir.</tspan></text>
<rect x="35" y="1390" width="350" height="95" rx="0" fill="#9f1720" opacity="0.98"/>
<text x="50" y="1422" text-anchor="start" fill="#fffaf0" font-family="Georgia,serif" font-size="15" font-weight="400" font-style="italic"><tspan x="50" dy="0">Prepararlo bien hoy hace</tspan><tspan x="50" dy="18">que todo sea más fácil después.</tspan></text>
</svg>