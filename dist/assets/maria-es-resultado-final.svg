<text x="820" y="500" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="820" dy="0">✓  Cabello alineado.</tspan></text>
<text x="820" y="587" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="820" dy="0">✓  Velo bien colocado.</tspan></text>
<text x="820" y="674" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="820" dy="0">✓  Brazos simétricos y firmes.</tspan></text>
<text x="820" y="761" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="820" dy="0">✓  Manto y vestido bien acabados.</tspan></text>
<text x="820" y="848" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="820" dy="0">✓  Base firme y estable.</tspan></text>
<text x="820" y="935" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="820" dy="0">✓  Acabado limpio y cuidado.</tspan></text>
<text x="820" y="1022" text-anchor="start" fill="#17364d" font-family="Georgia,serif" font-size="14" font-weight="400"><tspan x="820" dy="0">✓  ¡María está lista para Navidad!</tspan></text>
<text x="915" y="1120" text-anchor="middle" fill="#17364d" font-family="Georgia,serif" font-size="15" font-weight="400" font-style="italic"><tspan x="915" dy="0">Cada detalle lleva amor,</tspan><tspan x="915" dy="18">y el resultado es una pieza</tspan><tspan x="915" dy="18">única hecha por ti.</tspan></text>
<rect x="180" y="1390" width="690" height="90" rx="0" fill="#07513c" opacity="0.98"/>
<text x="525" y="1430" text-anchor="middle" fill="#fffaf0" font-family="Georgia,serif" font-size="16" font-weight="400" font-style="italic"><tspan x="525" dy="0">La Navidad se vuelve aún más especial cuando está hecha a mano.</tspan></text>
